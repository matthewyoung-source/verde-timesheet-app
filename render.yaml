databases:
  - name: verde-timesheet-db
    plan: basic-256mb

services:
  - type: web
    name: verde-timesheet-app
    runtime: docker
    plan: starter
    healthCheckPath: /login
    disk:
      name: verde-timesheet-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: verde-timesheet-db
          property: connectionString
      - key: COMPANY_NAME
        value: Verde Solutions
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
      - key: PDF_FOLDER
        value: /var/data/generated_pdfs
      # Fill these in from the admin dashboard's "Connect to Xero" flow, or
      # paste them in here once you've created your Xero app (see README).
      - key: XERO_CLIENT_ID
        sync: false
      - key: XERO_CLIENT_SECRET
        sync: false
      # Update this to match the real address Render gives the app after
      # its first deploy (shown on the service's dashboard page), then use
      # the same value as the redirect URI on your Xero app.
      - key: XERO_REDIRECT_URI
        value: https://verde-timesheet-app.onrender.com/xero/callback
      # Outgoing email -- password reset links and the 5pm daily reminder.
      # Until SMTP_HOST is filled in, these are skipped gracefully (just
      # logged), same as Xero above.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      # Gmail's SMTP relay requires this to match (or be a verified "send as"
      # alias of) the account in SMTP_USERNAME below.
      - key: MAIL_FROM
        value: matthew.young@verdesolutions.co.uk
      # Used to build absolute links in emails -- update to the real
      # address Render gives the app (same one used for XERO_REDIRECT_URI above).
      - key: APP_BASE_URL
        value: https://verde-timesheet-app.onrender.com
      # Daily "log your hours" reminder -- 5pm Pacific by default.
      - key: REMINDER_HOUR
        value: "17"
      - key: REMINDER_MINUTE
        value: "0"
      - key: REMINDER_TIMEZONE
        value: America/Los_Angeles
