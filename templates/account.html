{% extends "base.html" %}
{% block title %}My account - Verde Solutions{% endblock %}
{% block content %}
<div class="card" style="max-width:420px; margin: 40px auto;">
  <h2>My account</h2>
  <form method="POST">
    <label>Email</label>
    <input type="email" name="email" required value="{{ current_user.email }}" autocapitalize="off" autocorrect="off" spellcheck="false">

    <label style="margin-top:14px; display:block;">New password (leave blank to keep current)</label>
    <input type="password" name="new_password" id="new_password" autocapitalize="off" autocorrect="off" spellcheck="false">

    <label>Confirm new password</label>
    <input type="password" name="confirm_password" id="confirm_password" autocapitalize="off" autocorrect="off" spellcheck="false">

    <label style="margin-top:14px; display:block;">Current password (required to save any change)</label>
    <input type="password" name="current_password" id="current_password" required autocapitalize="off" autocorrect="off" spellcheck="false">

    <label style="font-weight:normal; margin-top:6px; display:flex; align-items:center; gap:6px;">
      <input type="checkbox" id="show-password" style="width:auto;"> Show passwords
    </label>

    <button class="btn" type="submit" style="width:100%; margin-top:14px;">Save changes</button>
  </form>
</div>
<script>
  document.getElementById('show-password').addEventListener('change', function () {
    var t = this.checked ? 'text' : 'password';
    document.getElementById('new_password').type = t;
    document.getElementById('confirm_password').type = t;
    document.getElementById('current_password').type = t;
  });
</script>
{% endblock %}
