{% extends "base.html" %}
{% block title %}Reset password - Verde Solutions{% endblock %}
{% block content %}
<div class="card" style="max-width:380px; margin: 40px auto;">
  <h2>Set a new password</h2>
  <form method="POST">
    <label>New password</label>
    <input type="password" name="new_password" id="new_password" required autocapitalize="off" autocorrect="off" spellcheck="false">
    <label>Confirm new password</label>
    <input type="password" name="confirm_password" id="confirm_password" required autocapitalize="off" autocorrect="off" spellcheck="false">
    <label style="font-weight:normal; margin-top:6px; display:flex; align-items:center; gap:6px;">
      <input type="checkbox" id="show-password" style="width:auto;"> Show passwords
    </label>
    <button class="btn" type="submit" style="width:100%; margin-top:10px;">Set new password</button>
  </form>
</div>
<script>
  document.getElementById('show-password').addEventListener('change', function () {
    var t = this.checked ? 'text' : 'password';
    document.getElementById('new_password').type = t;
    document.getElementById('confirm_password').type = t;
  });
</script>
{% endblock %}
