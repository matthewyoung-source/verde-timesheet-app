{% extends "base.html" %}
{% block title %}Reset password - Verde Solutions{% endblock %}
{% block auth_content %}
<div class="auth-card">
  <div class="auth-logo"><img src="{{ url_for('static', filename='logo-light.png') }}" alt="Verde Solutions"></div>
  <h1>Set a new password</h1>
  <p class="hint" style="text-align:center;">At least 8 characters.</p>
  <form method="POST">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>New password</label>
    <input type="password" name="new_password" id="new_password" required autocomplete="new-password">
    <label>Confirm new password</label>
    <input type="password" name="confirm_password" id="confirm_password" required autocomplete="new-password">
    <button class="btn" type="submit">Set new password</button>
  </form>
</div>
{% endblock %}
