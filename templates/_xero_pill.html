{% if p.xero_invoice_status == 'approved' %}<span class="pill green">Approved in Xero</span>
{% elif p.xero_invoice_status == 'draft_created' %}<span class="pill warning">Draft in Xero</span>
{% elif p.xero_invoice_status == 'not_connected' or not p.xero_invoice_status %}<span class="pill grey">Not sent</span>
{% else %}<span class="pill critical">Failed</span>{% endif %}
