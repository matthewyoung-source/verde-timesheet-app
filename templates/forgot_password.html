{% extends "base.html" %}
{% block title %}Forgot password - Verde Solutions{% endblock %}
{% block content %}
<div class="card" style="max-width:380px; margin: 40px auto;">
  <h2>Forgot password</h2>
  <p class="muted">Enter your email and we'll send you a link to set a new password.</p>
  <form method="POST">
    <label>Email</label>
    <input type="email" name="email" required autofocus autocapitalize="off" autocorrect="off" spellcheck="false">
    <button class="btn" type="submit" style="width:100%; margin-top:10px;">Send reset link</button>
  </form>
  <p class="muted" style="margin-top:14px; text-align:center;">
    <a href="{{ url_for('auth.login') }}">&larr; Back to log in</a>
  </p>
</div>
{% endblock %}
