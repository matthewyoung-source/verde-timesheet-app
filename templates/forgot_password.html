{% extends "base.html" %}
{% block title %}Forgot password - Verde Solutions{% endblock %}
{% block auth_content %}
<div class="auth-card">
  <div class="auth-logo"><img src="{{ url_for('static', filename='logo-light.png') }}" alt="Verde Solutions"></div>
  <h1>Forgot your password?</h1>
  <p class="hint" style="text-align:center;">Enter your email and we'll send you a link to set a new one.</p>
  <form method="POST">
    <label>Email</label>
    <input type="email" name="email" required autofocus autocomplete="email" inputmode="email" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="you@example.com">
    <button class="btn" type="submit">Send reset link</button>
  </form>
  <p class="auth-foot"><a href="{{ url_for('auth.login') }}">&larr; Back to log in</a></p>
</div>
{% endblock %}
