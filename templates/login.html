{% extends "base.html" %}
{% block title %}Log in - Verde Solutions{% endblock %}
{% block auth_content %}
<div class="auth-card">
  <div class="auth-logo"><img src="{{ url_for('static', filename='logo-light.png') }}" alt="Verde Solutions"></div>
  <h1>Welcome back</h1>
  <p class="hint" style="text-align:center;">Sign in to log your hours and receipts.</p>
  <form method="POST">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Email</label>
    <input type="email" name="email" required autofocus autocomplete="email" inputmode="email" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="you@example.com">
    <label>Password</label>
    <input type="password" name="password" id="password" required autocomplete="current-password" placeholder="Your password">
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="auth-foot"><a href="{{ url_for('auth.forgot_password') }}">Forgot your password?</a></p>
</div>
{% endblock %}
