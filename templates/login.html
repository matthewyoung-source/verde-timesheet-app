{% extends "base.html" %}
{% block title %}Log in - Verde Solutions{% endblock %}
{% block content %}
<div class="card" style="max-width:380px; margin: 40px auto;">
  <h2>Log in</h2>
  <form method="POST">
    <label>Email</label>
    <input type="email" name="email" required autofocus autocapitalize="off" autocorrect="off" spellcheck="false">
    <label>Password</label>
    <input type="password" name="password" id="password" required autocapitalize="off" autocorrect="off" spellcheck="false">
    <label style="font-weight:normal; margin-top:6px; display:flex; align-items:center; gap:6px;">
      <input type="checkbox" id="show-password" style="width:auto;"> Show password
    </label>
    <button class="btn" type="submit" style="width:100%; margin-top:10px;">Log in</button>
  </form>
  <p class="muted" style="margin-top:14px; text-align:center;">
    <a href="{{ url_for('auth.forgot_password') }}">Forgot your password?</a>
  </p>
</div>
<script>
  document.getElementById('show-password').addEventListener('change', function () {
    document.getElementById('password').type = this.checked ? 'text' : 'password';
  });
</script>
{% endblock %}
